	<title>KO Art Home</title>

	<!-- Speed up the external CDN requests below -->

	<link rel="preconnect" href="https://netdna.bootstrapcdn.com" crossorigin>
	<link rel="preconnect" href="https://fonts.googleapis.com" crossorigin>

<body class="home">

<button class="dark-mode-toggle" id="themeToggle">
	<i class="fa fa-moon-o"></i> Dark Mode
</button>

<header id="header"></header>

<main id="main">

	<div class="container">
		
		<div class="row section topspace">
			<h2 class="section-title"><span>Showcase</span></h2>

				<div class="thumbnails recentworks">
				
				<div class="col-xs-12 col-sm-6 col-md-4 col-lg-4">
					<a class="thumbnail" data-toggle="modal" data-target="#lightboxModal" data-filename="DarkDistricts.png">
						<span class="img"><img src="assets/Art/thumbs/DarkDistricts.jpg" alt="" loading="lazy" decoding="async"></span>
						<span class="title">Dark Districts</span>
						<h4></h4>
					</a>
					<h4></h4>
					<p></p>
				</div>

				<div class="col-xs-12 col-sm-6 col-md-4 col-lg-4">
					<a class="thumbnail" data-toggle="modal" data-target="#lightboxModal" data-filename="HollowSoul.png">
						<span class="img"><img src="assets/Art/thumbs/HollowSoul.jpg" alt="" loading="lazy" decoding="async"></span>
						<span class="title">Hollow Soul</span>
						<h4></h4>
					</a>
					<h4></h4>
					<p></p>
				</div>

				<div class="col-xs-12 col-sm-6 col-md-4 col-lg-4">
					<a class="thumbnail" data-toggle="modal" data-target="#lightboxModal" data-filename="GalaxyInGloss.png">
						<span class="img"><img src="assets/Art/thumbs/GalaxyInGloss.jpg" alt="" loading="lazy" decoding="async"></span>
						<span class="title">Galaxy in Gloss</span>
						<h4></h4>
					</a>
					<h4></h4>
					<p></p>
				</div>
				
			</div>



		</div> <!-- / section -->
	
		<div class="row section recentworks topspace">
			
			<h2 class="section-title"><span>Recent Works</span></h2>

			<div class="thumbnails recentworks row" id="recentWorks">
				<!-- Thumbnails are generated from assets/js/art-database.js by assets/js/gallery-loader.js -->
			</div>

		</div> <!-- /section -->

	</div>	<!-- /container -->

</main>

<!-- Modal injected via nav-loader.js -->
<div id="modal-placeholder"></div>

<footer id="footer" class="topspace"></footer>



<!-- JavaScript libs are placed at the end of the document so the pages load faster -->
<script src="https://ajax.googleapis.com/ajax/libs/jquery/1.10.2/jquery.min.js"></script>
<script src="https://maxcdn.bootstrapcdn.com/bootstrap/3.3.7/js/bootstrap.min.js"></script>

<script src="assets/js/dark-mode.js"></script>
